<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f5ee" />
    <meta name="description" content="coolstuff: a free, interactive, visual-first textbook for the core of a university STEM and CS degree, from calculus and linear algebra to diffusion models, LLMs and physics." />
    <title>coolstuff — an interactive textbook for STEM and CS</title>
    <script>

    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/site/preview/home.tsx"></script>
  </body>
</html>
