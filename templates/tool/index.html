<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main>
      <h1>{{title}}</h1>
      <label for="input">Input</label>
      <textarea id="input" rows="6"></textarea>
      <div class="actions">
        <button id="export" type="button">Export <kbd>⌘E</kbd></button>
        <label class="button">Import <input id="import" type="file" accept="application/json" hidden /></label>
      </div>
      <output id="output" for="input"></output>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
