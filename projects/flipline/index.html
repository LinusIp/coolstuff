<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#07041a" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Flipline: a one-thumb gravity-flip runner through procedurally generated neon sunsets." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Flipline</title>
  </head>
  <body>
    <canvas id="game" aria-hidden="true"></canvas>

    <div id="hud" class="hud" hidden>
      <div class="hud-left">
        <span class="hud-label">Distance</span>
        <span class="hud-value"><span id="dist">0</span><small>m</small></span>
      </div>
      <div class="hud-right">
        <span class="hud-label">Score</span>
        <span class="hud-value" id="score">0</span>
        <span class="combo" id="combo" aria-live="off"></span>
      </div>
      <button class="icon-btn pause-btn" id="pause" type="button" aria-label="Pause">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" /><rect x="14" y="5" width="4" height="14" rx="1" /></svg>
      </button>
    </div>

    <div id="banner" class="banner" aria-live="polite"></div>

    <section id="title" class="screen title-screen" aria-labelledby="logo">
      <div class="panel">
        <h1 id="logo" class="logo" data-text="FLIPLINE">FLIPLINE</h1>
        <p class="tagline">One tap flips gravity. Stay on the line.</p>
        <button id="play" class="btn primary" type="button">Play</button>
        <p class="best" id="best-line"></p>
        <p class="hint"><span class="touch-only">Tap anywhere to flip</span><span class="key-only">Space / ↑ ↓ to flip · P pause · M mute</span></p>
      </div>
      <div class="corner-links">
        <a class="back" href="../../">← coolstuff</a>
        <button id="sound" class="icon-btn" type="button" aria-pressed="true" aria-label="Sound on">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9h4l5-4v14l-5-4H4z" /><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" /><path class="mute" d="m16 9 6 6m0-6-6 6" /></svg>
        </button>
      </div>
    </section>

    <section id="paused" class="screen" hidden aria-labelledby="paused-title">
      <div class="panel">
        <h2 id="paused-title" class="screen-title">Paused</h2>
        <button id="resume" class="btn primary" type="button">Resume</button>
        <button id="quit" class="btn ghost" type="button">Main menu</button>
      </div>
    </section>

    <section id="over" class="screen" hidden aria-labelledby="over-title">
      <div class="panel">
        <h2 id="over-title" class="screen-title">Wipeout</h2>
        <p class="final"><span id="final-score">0</span></p>
        <p class="new-best" id="new-best" hidden>New best!</p>
        <dl class="stats">
          <div><dt>Distance</dt><dd id="st-dist">0 m</dd></div>
          <div><dt>Orbs</dt><dd id="st-orbs">0</dd></div>
          <div><dt>Best combo</dt><dd id="st-combo">0</dd></div>
          <div><dt>Close calls</dt><dd id="st-close">0</dd></div>
        </dl>
        <p class="best" id="over-best"></p>
        <button id="retry" class="btn primary" type="button">Retry</button>
        <button id="menu" class="btn ghost" type="button">Main menu</button>
      </div>
    </section>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
